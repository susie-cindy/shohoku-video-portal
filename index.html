<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex,nofollow">
  <title>勝北VBC VIDEO PORTAL</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family:
        -apple-system, BlinkMacSystemFont,
        "Segoe UI", "Noto Sans JP", sans-serif;
      background: #f4f6f8;
      color: #202124;
    }

    header {
      background: #ffffff;
      border-bottom: 1px solid #e1e5e9;
      padding: 22px 20px 18px;
    }

    .header-inner {
      max-width: 1200px;
      margin: 0 auto;
    }

    h1 {
      margin: 0;
      font-size: 26px;
      letter-spacing: 0.04em;
    }

    .subtitle {
      margin-top: 5px;
      color: #dc2626;
      font-size: 14px;
    }

    main {
      max-width: 1200px;
      margin: 0 auto;
      padding: 24px 20px 50px;
    }

    .news-panel {
      background: #ffffff;
      border-radius: 14px;
      padding: 18px;
      margin-bottom: 20px;
      box-shadow: 0 2px 10px rgba(0,0,0,.05);
    }

    .news-heading {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 8px 12px;
      margin-bottom: 12px;
    }

    .news-heading h2 {
      margin: 0;
      font-size: 18px;
    }

    .news-list {
      margin: 0;
      padding: 0;
      list-style: none;
    }

    .news-item {
      display: grid;
      grid-template-columns: 105px minmax(0, 1fr);
      gap: 5px 14px;
      padding: 12px 0;
      border-top: 1px solid #edf0f3;
    }

    .news-date {
      color: #6b7280;
      font-size: 13px;
      line-height: 1.7;
      white-space: nowrap;
      font-variant-numeric: tabular-nums;
    }

    .news-summary {
      margin: 0;
      font-size: 14px;
      font-weight: 600;
      line-height: 1.7;
    }

    .news-events {
      margin: 3px 0 0;
      padding: 0;
      list-style: none;
      color: #6b7280;
      font-size: 13px;
      line-height: 1.7;
      overflow-wrap: anywhere;
    }

    @media (max-width: 520px) {
      .news-panel {
        padding: 13px;
        margin-bottom: 16px;
      }

      .news-item {
        grid-template-columns: minmax(0, 1fr);
        gap: 3px;
      }
    }

    .filter-panel {
      background: #ffffff;
      border-radius: 14px;
      padding: 18px;
      margin-bottom: 25px;
      box-shadow: 0 2px 10px rgba(0,0,0,.05);
    }

    .filter-title {
      font-size: 13px;
      color: #6b7280;
      margin-bottom: 10px;
    }

    .filters {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 10px;
    }

    select {
      width: 100%;
      padding: 11px 12px;
      border: 1px solid #d5dae0;
      border-radius: 8px;
      background: white;
      font-size: 14px;
      color: #333;
    }

    select.filter-active {
      background: #e8f0fe;
      border-color: #7b9acc;
      font-weight: 600;
    }

    .section-title {
      margin: 0 0 15px;
      font-size: 18px;
    }

    .video-count {
      margin-left: 6px;
      color: #6b7280;
      font-size: 13px;
      font-weight: normal;
    }

    .video-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 22px;
    }

    .video-card {
      display: block;
      background: #ffffff;
      border-radius: 13px;
      overflow: hidden;
      text-decoration: none;
      color: inherit;
      box-shadow: 0 3px 12px rgba(0,0,0,.07);
      transition: transform .15s ease, box-shadow .15s ease;
    }

    .video-card:hover {
      transform: translateY(-3px);
      box-shadow: 0 7px 20px rgba(0,0,0,.12);
    }

    .thumbnail {
      position: relative;
      aspect-ratio: 16 / 9;
      background: #ddd;
      overflow: hidden;
    }

    .thumbnail img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .play-button {
      position: absolute;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%);
      width: 54px;
      height: 54px;
      border-radius: 50%;
      background: rgba(0,0,0,.65);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .play-button::after {
      content: "";
      margin-left: 4px;
      border-left: 17px solid white;
      border-top: 11px solid transparent;
      border-bottom: 11px solid transparent;
    }

    .video-info {
      padding: 14px 15px 16px;
    }

    .video-title {
      font-size: 16px;
      font-weight: 600;
      line-height: 1.45;
    }

    .empty-message {
      grid-column: 1 / -1;
      background: #ffffff;
      border-radius: 13px;
      padding: 35px 20px;
      text-align: center;
      color: #6b7280;
    }

    .notice {
      margin-top: 35px;
      padding: 14px 16px;
      background: #ffffff;
      border-left: 4px solid #8b949e;
      border-radius: 7px;
      font-size: 12px;
      line-height: 1.7;
      color: #687078;
    }

    @media (max-width: 850px) {
      .filters {
        grid-template-columns: repeat(2, 1fr);
      }

      .video-grid {
        grid-template-columns: repeat(2, 1fr);
      }
    }

    @media (max-width: 520px) {
      header {
        padding: 18px 15px 15px;
      }

      h1 {
        font-size: 21px;
      }

      main {
        padding: 16px 12px 35px;
      }

      .filter-panel {
        padding: 13px;
        margin-bottom: 20px;
      }

      .filters {
        grid-template-columns: repeat(2, 1fr);
        gap: 8px;
      }

      select {
        font-size: 13px;
        padding: 9px;
      }

      .video-grid {
        grid-template-columns: repeat(2, 1fr);
        gap: 11px;
      }

      .video-info {
        padding: 10px;
      }

      .video-title {
        font-size: 13px;
      }

      .play-button {
        width: 42px;
        height: 42px;
      }

      .play-button::after {
        border-left-width: 13px;
        border-top-width: 8px;
        border-bottom-width: 8px;
      }
    }
  </style>
</head>

<body>

<header>
  <div class="header-inner">
    <h1>勝北VBC VIDEO PORTAL</h1>
    <div class="subtitle">第三者へのページURL・動画URLの共有禁止！</div>
  </div>
</header>

<main>

  <section id="news-panel" class="news-panel" aria-labelledby="news-title" hidden>
    <div class="news-heading">
      <h2 id="news-title">新着情報</h2>
    </div>
    <ol id="news-list" class="news-list" aria-label="直近1回のアップロード履歴"></ol>
  </section>

  <div class="filter-panel">
    <div class="filter-title">動画を絞り込む</div>

    <div class="filters">
      <select id="filter-event">
        <option value="">大会</option>
      </select>

      <select id="filter-play">
        <option value="">プレー</option>
      </select>

      <select id="filter-player">
        <option value="">選手</option>
      </select>

      <select id="filter-position">
        <option value="">ポジション</option>
      </select>
    </div>
  </div>

  <h2 class="section-title">
    プレー振り返り
    <span id="video-count" class="video-count"></span>
  </h2>

  <div id="video-grid" class="video-grid"></div>

  <div class="notice">
    本ページは、チーム内でのプレー振り返りを目的とした
    動画共有ポータルです。<br>
    掲載動画はYouTubeの限定公開機能を利用しています。
    ページURLおよび動画URLの第三者への共有はお控えください。
  </div>

</main>

<script>
  let allVideos = [];

  const filterMap = [
    ["filter-event", "大会"],
    ["filter-play", "プレー"],
    ["filter-player", "選手"],
    ["filter-position", "ポジション"]
  ];

  function getCategoryValues(video, category) {
    return video.categories?.[category] || [];
  }

  function renderLatestNews(news) {
    const panel = document.getElementById("news-panel");
    const list = document.getElementById("news-list");
    panel.hidden = true;
    list.replaceChildren();
    try {
      const latest = Array.isArray(news) ? news[0] : null;
      if (!latest || !Number.isInteger(latest.videoCount) || latest.videoCount < 1) return;
      const uploadedAt = new Date(latest.uploadedAt);
      if (!latest.uploadedAt || Number.isNaN(uploadedAt.getTime())) return;
      if (!Array.isArray(latest.events) || latest.events.length === 0) return;
      if (latest.events.some(event =>
        !event || typeof event.eventName !== "string" || !event.eventName.trim() ||
        !Number.isInteger(event.videoCount) || event.videoCount < 1
      )) return;
      if (latest.events.reduce((sum, event) => sum + event.videoCount, 0) !== latest.videoCount) return;

      const item = document.createElement("li");
      item.className = "news-item";
      const time = document.createElement("time");
      time.className = "news-date";
      time.dateTime = latest.uploadedAt;
      const dateText = new Intl.DateTimeFormat("ja-JP", {
        timeZone: "Asia/Tokyo", month: "numeric", day: "numeric"
      }).format(uploadedAt);
      const timeText = new Intl.DateTimeFormat("ja-JP", {
        timeZone: "Asia/Tokyo", hour: "2-digit", minute: "2-digit", hourCycle: "h23"
      }).format(uploadedAt);
      time.textContent = `${dateText} ${timeText}`;

      const detail = document.createElement("div");
      const summary = document.createElement("p");
      summary.className = "news-summary";
      summary.textContent = `動画を${latest.videoCount}本追加しました`;
      const events = document.createElement("ul");
      events.className = "news-events";
      for (const event of latest.events) {
        const row = document.createElement("li");
        const name = event.eventName.trim();
        let label = name;
        if (typeof event.eventDate === "string" && /^\d{4}-\d{2}-\d{2}$/.test(event.eventDate)) {
          const [, month, day] = event.eventDate.split("-");
          const date = `${Number(month)}/${Number(day)}`;
          const japaneseDate = `${Number(month)}月${Number(day)}日`;
          if (!name.includes(date) && !name.includes(japaneseDate)) label = `${date} ${name}`;
        }
        row.textContent = `${label}：${event.videoCount}本`;
        events.appendChild(row);
      }
      detail.append(summary, events);
      item.append(time, detail);
      list.appendChild(item);
      panel.hidden = false;
    } catch (error) {
      console.warn("新着情報を表示できませんでした。", error);
      panel.hidden = true;
    }
  }

  function fillFilter(selectId, category) {
    const select = document.getElementById(selectId);

    const values = [
      ...new Set(
        allVideos.flatMap(video =>
          getCategoryValues(video, category)
        )
      )
    ].sort((a, b) => a.localeCompare(b, "ja"));

    for (const value of values) {
      const option = document.createElement("option");
      option.value = value;
      option.textContent = value;
      select.appendChild(option);
    }
  }

  function createVideoCard(video) {
    const card = document.createElement("a");
    card.className = "video-card";
    card.target = "_blank";
    card.rel = "noopener noreferrer";

    const youtubeBase =
      "https:" + "//" + "youtu" + ".be/";

    card.href = youtubeBase + video.id;

    const thumbnail = document.createElement("div");
    thumbnail.className = "thumbnail";

    const img = document.createElement("img");
    img.src = video.thumbnail;
    img.alt = video.title;
    img.loading = "lazy";

    const playButton = document.createElement("div");
    playButton.className = "play-button";

    thumbnail.appendChild(img);
    thumbnail.appendChild(playButton);

    const info = document.createElement("div");
    info.className = "video-info";

    const title = document.createElement("div");
    title.className = "video-title";
    title.textContent = video.title;

    info.appendChild(title);

    card.appendChild(thumbnail);
    card.appendChild(info);

    return card;
  }

  function renderVideos() {
    const grid = document.getElementById("video-grid");

    for (const [selectId] of filterMap) {
     const select = document.getElementById(selectId);

     select.classList.toggle(
       "filter-active",
       select.value !== ""
     );
   }

    const activeFilters = filterMap.map(
      ([selectId, category]) => ({
        category,
        value: document.getElementById(selectId).value
      })
    );

    const filtered = allVideos.filter(video =>
      activeFilters.every(filter =>
        !filter.value ||
        getCategoryValues(video, filter.category)
          .includes(filter.value)
      )
    );

    grid.replaceChildren();

    if (filtered.length === 0) {
      const message = document.createElement("div");
      message.className = "empty-message";
      message.textContent =
        "条件に一致する動画はありません。";

      grid.appendChild(message);
    } else {
      for (const video of filtered) {
        grid.appendChild(createVideoCard(video));
      }
    }

    document.getElementById("video-count").textContent =
      `（${filtered.length}本）`;
  }

  async function init() {
    try {
      const response = await fetch(
        "./data/videos.json",
        { cache: "no-store" }
      );

      if (!response.ok) {
        throw new Error(
          `videos.json取得失敗: ${response.status}`
        );
      }

      const data = await response.json();

      allVideos = data.videos || [];
      renderLatestNews(data.news);

      for (const [selectId, category] of filterMap) {
        fillFilter(selectId, category);

        document
          .getElementById(selectId)
          .addEventListener("change", renderVideos);
      }

      renderVideos();

    } catch (error) {
      console.error(error);

      const grid =
        document.getElementById("video-grid");

      grid.innerHTML =
        '<div class="empty-message">' +
        '動画データを読み込めませんでした。' +
        '</div>';
    }
  }

  init();
</script>

</body>
</html>
